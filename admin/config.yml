backend:
  name: git-gateway
  branch: main

media_folder: "brand_assets"
public_folder: "/brand_assets"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Home Page"
        name: "home"
        fields:
          - {label: "Body HTML", name: "body", widget: "markdown"}